[project]
name = "generalized-path-finding"
version = "0.1.0"
authors = [
    { name = "FZI", email = "stampa@fzi.de" },
    { name = "Linus Schöb", email = "dev@linusschoeb.de" }
]
description = "library for reading various formats for logistics networks and finding shortest paths in them"
readme = "README.md"
license = { file = "LICENSE" }
dependencies = [
    "geomdl>=5.4.0,<6",
    "auto-all>=1.4.1,<2",
    "networkx~=3.5",
    "pytest>=8.4.0,<9",
    "beartype==0.21.0",
    "certifi>=2025.7.9",
    "colorama==0.4.6",
    "contourpy>=1.3.2",
    "coverage>=7.9.2",
    "cycler==0.12.1",
    "cykhash==2.0.1",
    "Cython>=3.1.2",
    "et_xmlfile==2.0.0",
    "fonttools>=4.59.0",
    "geographiclib==2.0",
    "geopandas==1.1.1",
    "geopy==2.4.1",
    "hatchling>=1.27.0",
    "iniconfig==2.1.0",
    "Jinja2==3.1.6",
    "kiwisolver>=1.4.8",
    "MarkupSafe==3.0.2",
    "matplotlib>=3.10.3",
    "numpy>=2.3.1",
    "openpyxl==3.1.5",
    "packaging==25.0",
    "pandas==2.3.1",
    "pathspec>=0.12.1",
    "pillow==11.3.0",
    "pluggy==1.6.0",
    "Pygments>=2.19.1",
    "pyogrio==0.11.0",
    "pyparsing==3.2.3",
    "pyproj>=3.7.1",
    "python-dateutil==2.9.0.post0",
    "python-rapidjson==1.21",
    "pytz==2025.2",
    "setuptools==80.9.0",
    "shapely==2.1.1",
    "six==1.17.0",
    "trove-classifiers>=2025.5.9.12",
    "tzdata>=2025.2",
]
requires-python = "~=3.13"

[project.optional-dependencies]
osm = ["pyrosm>=0.6.2,<0.7", "pyrobuf==0.9.3",]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64"]

[tool.pixi.pypi-dependencies]
generalized_path_finding = { path = ".", editable = true }
pyroutingkit = { path = "./pyroutingkit/src", editable = true }

[tool.pixi.tasks]
test = "pytest"

[tool.pixi.dependencies]
openpyxl = ">=3.1.5,<4"
beartype = ">=0.21.0,<0.22"
python = "3.13.*"
pixi-pycharm = ">=0.0.9,<0.0.10"
geopy = ">=2.4.1,<3"
matplotlib = ">=3.10.5,<4"
geopandas = ">=1.1.1,<2"
coverage = ">=7.10.3,<8"
hatch = ">=1.14.1,<2"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "test",
]
